[project]
name = "llm-output"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.11.0",
    "pydantic[email]>=2.13.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
llm-output = "llm_output:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
